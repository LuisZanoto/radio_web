<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor da Melody FM</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    body {
      box-sizing: border-box;
      width: 320px;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    #status {
      min-height: 44px;
      margin: 16px 0;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    button {
      min-height: 42px;
      padding: 9px 14px;
      border: 0;
      border-radius: 9px;
      background: #f97316;
      color: #111827;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #374151;
      color: #f9fafb;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .note {
      margin: 16px 0 0;
      color: #94a3b8;
      font-size: 0.78rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <h1>Melody FM</h1>
  <div id="status" role="status" aria-live="polite">Verificando monitor...</div>
  <div class="actions">
    <button id="startButton" type="button">Iniciar áudio</button>
    <button class="secondary" id="stopButton" type="button">Parar áudio</button>
  </div>
  <p class="note">
    Reconecta quando o tempo do player não avança por 5 segundos. Silêncio intencional
    da transmissão não é detectado.
  </p>
  <script src="popup.js"></script>
</body>
</html>
